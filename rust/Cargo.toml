[package]
name = "panic-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A portable reconstruction of Future Crew's Panic (1992)"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:sdl2"]

[dependencies]
sdl2 = { version = "=0.38.0", optional = true, features = ["bundled", "static-link"] }
sha2 = "0.10"
